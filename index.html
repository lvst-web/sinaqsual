if(v==="subj"){const k=V.x;A.innerHTML=`<button onclick="go('home')">← Ana səhifə</button><h1>${CUR[k][0]}</h1><div class="m">Fənn üzrə nəticə: ${lab(sp(k))}</div>`+parse(CUR[k][1]).map(s=>`<h2>${s.n}</h2>`+s.t.map(t=>{const p=tp(t),has=!!Q[t];return`<div class="card"><div class="row" ${has?`onclick="go('topic','${t}')"`:""}><div><b>${t}</b><div class="m">${has?lab(p):"suallar tezliklə"}</div></div>${has?"<span>›</span>":""}</div>${p!==null?bar(p):""}</div>`}).join("")).join("")}
if(v==="topic"){const t=V.x,r=S.t[t],n=Math.min(50,Q[t].length);A.innerHTML=`<button onclick="history.length&&go('subj','${Object.keys(CUR).find(k=>topics(k).includes(t))}')">← Mövzular</button><h1>${t}</h1><div class="card">Bilik səviyyən: ${lab(r?r.p:null)}${r&&r.prev!==null?`<div class="m">Əvvəl: ${r.prev}% → İndi: ${r.p}%</div>`:""}</div><button class="p" onclick="start('${t}')">${n} suallıq testə başla</button> ${r&&r.wrong&&r.wrong.length?`<button onclick="start('${t}',1)">Səhv etdiyim sualları təkrar et (${r.wrong.length})</button>`:""}<p class="m">Bu mövzuda hazırda ${Q[t].length} sual var; test bazadakı suallardan (ən çoxu 50) təsadüfi seçilir.</p>`}
if(v==="test"){const o=T.qs[T.i],u=T.a[T.i],n=T.qs.length,left=n-T.a.filter(x=>x!==undefined).length;A.innerHTML=`<div class="m">${T.n} · sual ${T.i+1}/${n} · cavabsız: ${left}</div>${bar((T.i+1)/n*100)}<div class="card"><b>${o.q[0]}</b></div>`+o.q[1].map((x,j)=>`<button class="opt ${u===j?"s":""}" onclick="pick(${j})" aria-pressed="${u===j}"><b>${L[j]}</b><span>${x}</span></button>`).join("")+`<div class="row" style="margin-top:12px"><button ${T.i?"":"disabled"} onclick="step(-1)">← Əvvəlki</button>${T.i<n-1?`<button class="p" onclick="step(1)">Növbəti →</button>`:`<button class="p" onclick="finish()">Testi bitir</button>`}</div>`}
if(v==="res"){A.innerHTML=`<div class="card" style="text-align:center"><div class="m">${R.n}${R.retake?" · təkrar test":""}</div><div class="big">${R.p}%</div><div><span class="ok">${R.c} düzgün</span> · <span class="bad">${R.w} səhv</span> · ${R.e} boş</div><p>${R.exam?"Sınaq nəticən":"Mövzu üzrə bilik səviyyən"}: <b>${R.retake?(tp(R.n)??R.p):R.p}%</b> ${lvl(R.retake?(tp(R.n)??R.p):R.p)[1]}</p></div><button class="p" onclick="go('mist')" ${R.w+R.e?"":"disabled"}>Səhv etdiyin suallara bax</button> <button onclick="start('${R.n}',1)" ${!R.exam&&S.t[R.n].wrong.length?"":"disabled"}>Səhvlərdən yenidən test yarat</button> <button onclick="go('home')">Ana səhifə</button>`}
if(v==="mist"){const m=R.items.filter(x=>x.u!==x.q[2]);A.innerHTML=`<button onclick="go('res')">← Nəticə</button><h1>Səhvlərim</h1>`+m.map(x=>`<div class="card"><b>${x.q[0]}</b><div class="bad">Sənin cavabın: ${x.u===undefined?"boş":L[x.u]+") "+x.q[1][x.u]}</div><div class="ok">Düzgün cavab: ${L[x.q[2]]}) ${x.q[1][x.q[2]]}</div><div class="m">${x.q[3]}</div></div>`).join("")}}
render();
</script></body></html>
